name: Update availability calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check feed configuration
        id: feeds
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
        run: |
          if [ -z "${AIRBNB_ICAL_URL}${BOOKING_ICAL_URL}${VRBO_ICAL_URL}" ]; then
            echo "No iCal feed secrets configured; skipping availability update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build sanitized availability files
        if: steps.feeds.outputs.configured == 'true'
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
        run: python3 scripts/build-availability.py --require-feed

      - name: Commit generated availability files
        if: steps.feeds.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/availability.json calendar/la-sosta-availability.ics; then
            echo "No availability changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json calendar/la-sosta-availability.ics
          git commit -m "Update availability calendar"
          git push

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repository activity. When bookings are quiet — or the feed secrets are
      # unset — nothing above ever commits, so the clock runs out and the
      # schedule stops. Push a heartbeat before that happens.
      - name: Keep the schedule alive
        run: |
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit on $(git rev-parse --abbrev-ref HEAD) was ${age_days} day(s) ago."
          if [ "$age_days" -lt 45 ]; then
            echo "Under the 45-day threshold; no heartbeat needed."
            exit 0
          fi
          echo "Approaching the 60-day inactivity limit; pushing a heartbeat."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/workflow-heartbeat
          git add .github/workflow-heartbeat
          git commit -m "chore: workflow heartbeat (keeps the schedule enabled)"
          git push
